<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SlideX</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  #drop { position: absolute; inset: 20px; border: 2px dashed #444; border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    text-align: center; transition: border-color .15s, background .15s; }
  #drop.over { border-color: #6cf; background: rgba(102, 204, 255, .06); }
  h1 { margin: 0; font-size: 26px; font-weight: 600; color: #fff; }
  p { margin: 0; color: #999; }
  button { font: inherit; font-size: 16px; padding: 8px 22px; border-radius: 8px; border: 0;
    background: #2f7fd1; color: #fff; cursor: pointer; }
  button:hover { background: #3a8ee6; }
  code { color: #9cf; }
</style>
</head>
<body>
<div id="drop">
  <h1>SlideX</h1>
  <p>Drop a beamer PDF here, or</p>
  <button id="open">Open PDF…</button>
  <p>Movies placed with the slidemovie LaTeX package (<code>\slidemovie{…}</code>) play in place.<br>
     Press <code>?</code> in a deck for keys, <code>s</code> for the presenter window.</p>
</div>
<script>
  const api = window.slidexApp;
  document.getElementById('open').onclick = () => api && api.open();
  const drop = document.getElementById('drop');
  addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  addEventListener('dragleave', () => drop.classList.remove('over'));
  addEventListener('drop', (e) => {
    e.preventDefault(); drop.classList.remove('over');
    const f = e.dataTransfer.files[0];
    if (f && api) api.open(api.pathForFile(f));
  });
</script>
</body>
</html>
