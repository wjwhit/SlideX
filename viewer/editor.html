<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlideX editor</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header id="bar">
  <span id="deckname"></span>
  <select id="framepick" title="Go to a frame"></select>
  <span class="sep"></span>
  <button type="button" id="btn-frame" title="Compile this slide from the text in the editor (Cmd-Enter); the file is not saved">Compile slide</button>
  <label id="livebox" title="Recompile the slide half a second after you stop typing"><input type="checkbox" id="live" checked> Live</label>
  <span class="sep"></span>
  <button type="button" id="btn-save" title="Save the .tex (Cmd-S)">Save</button>
  <button type="button" id="btn-deck" title="Save, compile the whole deck, reload the presenter and the slide strip (Shift-Cmd-Enter)">Compile deck</button>
  <button type="button" id="btn-settings" title="Title page, theme, colours, header and footer (Shift-Cmd-D)">Deck…</button>
  <span id="status"></span>
  <button type="button" id="btn-compile-present" title="Save, compile the whole deck, then present from this slide">Compile &amp; Present</button>
  <button type="button" id="btn-present" title="Present the deck as last compiled, from this slide (Edit or Cmd-E in the deck switches back)">Present ▶</button>
</header>
<main id="split">
  <nav id="strip"></nav>
  <section id="code"></section>
  <div id="divider" title="Drag to resize"></div>
  <section id="right">
    <div id="pages"></div>
    <aside id="deckpanel" hidden></aside>
    <div id="preview"><div id="pagewrap"><canvas id="pagecanvas"></canvas><div id="marks"></div></div>
      <div id="placeholder">Put the cursor in a frame to see it here.</div></div>
    <div id="errors" hidden></div>
    <div id="output">
      <div id="out-resize" title="Drag to resize"></div>
      <div id="out-head"><span id="out-title">LaTeX output</span><span id="out-sum"></span><button type="button" id="out-toggle" title="Show or hide the output">▾</button></div>
      <pre id="out-log"></pre>
    </div>
  </section>
</main>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/codemirror.js"></script>
<script src="editor-complete.js"></script>
<script src="editor.js"></script>
</body>
</html>
